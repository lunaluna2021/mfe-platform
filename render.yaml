# Render Blueprint：在 Render 選擇「New → Blueprint」並連結這個 repo，就會依此建立 API 服務。
services:
  - type: web
    name: mfe-platform-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /actuator/health
    autoDeploy: true
    # 只有後端的檔案變更時才重新部署
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: mfe_api.shsaitraeevigslqjaab
      # 資料庫密碼不放在 repo，建立服務時在 Render 後台填入
      - key: DB_PASSWORD
        sync: false
      # 由 Render 產生隨機的 256-bit 金鑰（Base64）
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://lunaluna2021.github.io
