<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>客戶管理（獨立執行）</title>
    <!-- 相對路徑：不論放在哪個目錄都能找到同目錄下的 main.js 與 runtime-config.json -->
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <p class="harness-note">
      獨立執行模式：模組自帶登入畫面，方便單獨開發與測試。
      與平台在同一個網域時共用登入狀態（SSO）：在平台已登入，這裡會直接沿用。
    </p>
    <!-- is-standalone 屬性讓模組載入自己的登入外框；被 Host 載入時沒有這個屬性 -->
    <mfe-customer is-standalone></mfe-customer>
  </body>
</html>
