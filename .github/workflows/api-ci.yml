name: API CI

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/api-ci.yml
  pull_request:
    paths:
      - apps/api/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify 會執行測試，包含三層式架構的 ArchUnit 檢查；測試不需要資料庫
      - name: Build and test
        run: ./mvnw -B verify
